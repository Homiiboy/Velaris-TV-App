name: Repair Velaris logo assets

on:
  push:
    branches: [main]
    paths:
      - 'branding/logo-parts/**'
      - '.github/workflows/repair-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean logo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branding app/src/main/res/drawable-nodpi
          cat branding/logo-parts/part*.b64 | base64 --decode > branding/velaris-tv-logo.webp
          cp branding/velaris-tv-logo.webp app/src/main/res/drawable-nodpi/velaris_logo.webp
          rm -f branding/velaris-tv-logo.png app/src/main/res/drawable-nodpi/velaris_logo.png
          sed -i 's#branding/velaris-tv-logo.png#branding/velaris-tv-logo.webp#g' README.md
          file branding/velaris-tv-logo.webp
          test "$(stat -c%s branding/velaris-tv-logo.webp)" -gt 20000

      - name: Commit repaired assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md branding app/src/main/res/drawable-nodpi
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: replace corrupted Velaris logo asset'
          git push origin HEAD:main
